<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131418" />
    <title>Ritween — Source to motion</title>
    <script>
      try {
        var stored;
        try {
          var preferences = JSON.parse(
            localStorage.getItem("ritween-studio-preferences") || "null",
          );
          if (
            preferences &&
            preferences.version === 1 &&
            (preferences.theme === "light" || preferences.theme === "dark")
          )
            stored = preferences.theme;
        } catch (e) {}
        if (!stored) stored = localStorage.getItem("ritween-theme");
        var dark = stored !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#131418" : "#c8c9d0");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
